name: Refresh programme and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore OMDb cache
        uses: actions/cache@v5
        with:
          path: .cache/omdb.json
          key: omdb-${{ github.run_id }}
          restore-keys: omdb-
      - run: npm run scrape
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      - run: npm run build
      - name: Save generated programme for diagnostics
        uses: actions/upload-artifact@v5
        with:
          name: program-json
          path: site/program.json
          retention-days: 7
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.DOKINACLOUDFLARE }}
          accountId: 90818bca137fa0127be7a6560712fe3b
          command: deploy
